name: Workout image tests
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths: ['.github/workflows/media.yml', 'Dockerfile.media', 'requirements.media.lock', 'compose.media*.yaml', 'src/sparkyfitness_strava/media/**', 'tests/media/**']
  pull_request:
    paths: ['.github/workflows/media.yml', 'Dockerfile.media', 'requirements.media.lock', 'compose.media*.yaml', 'src/sparkyfitness_strava/media/**', 'tests/media/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f compose.media.test.yaml build test
      - run: docker compose -f compose.media.test.yaml up -d --wait mock-strava-web
      - run: docker compose -f compose.media.test.yaml run --rm test
      - name: Render review previews
        run: docker compose -f compose.media.yaml run --rm preview
      - name: Stop test services
        if: always()
        run: docker compose -f compose.media.test.yaml down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: media-test-reports
          path: |
            reports/
            design/previews/*.png
