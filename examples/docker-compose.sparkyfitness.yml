# Place beside your existing sparkyfitness Compose file; no connector checkout is needed.
# The overlay assumes sparkyfitness's server service is on the default network.
services:
  strava-connector:
    image: ${STRAVA_CONNECTOR_IMAGE:-ghcr.io/willtheorangeguy/sparkyfitness-strava-connector}:${STRAVA_CONNECTOR_VERSION:-0.1.0}
    environment:
      SPARKYFITNESS_BASE_URL: ${STRAVA_SPARKYFITNESS_BASE_URL:-http://sparkyfitness-server:3010}
      SPARKYFITNESS_API_KEY: ${STRAVA_SPARKYFITNESS_API_KEY:?Set STRAVA_SPARKYFITNESS_API_KEY}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:?Set STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:?Set STRAVA_CLIENT_SECRET}
      WORKOUT_TIMEZONE: ${STRAVA_WORKOUT_TIMEZONE:-UTC}
      EXPORT_SINCE: ${STRAVA_EXPORT_SINCE:-}
      SYNC_INTERVAL_SECONDS: ${STRAVA_SYNC_INTERVAL_SECONDS:-900}
      SETTLE_SECONDS: ${STRAVA_SETTLE_SECONDS:-300}
      MAX_UPLOADS_PER_SYNC: ${STRAVA_MAX_UPLOADS_PER_SYNC:-10}
    # Run continuously beside the main service and export new eligible workouts.
    command: [watch]
    init: true
    restart: unless-stopped
    volumes: ['strava_connector_state:/data']
volumes:
  strava_connector_state:
